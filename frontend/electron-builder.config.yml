appId: com.sentinel.app
productName: Sentinel
copyright: "Copyright © 2025 Sentinel"
executableName: Sentinel

directories:
  output: "../dist-electron"

files:
  - "**/*"
  - "dist/**/*"
  - "dist/*"

asar: true

publish: null

extraResources:
  - from: "electron/icons"
    to: "icons"
    filter: ["**/*"]

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: "icons/icon.ico"

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sentinel
  uninstallDisplayName: Sentinel HR Simulator
  installerIcon: "icons/icon.ico"
  uninstallerIcon: "icons/icon.ico"
  installerHeaderIcon: "icons/icon.ico"

linux:
  target:
    - AppImage
    - deb
  icon: "icons/icon.png"
  category: Office
  maintainer: Sentinel Team <sentinel@example.com>