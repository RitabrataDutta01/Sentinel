appId: com.sentinel.app
productName: Sentinel
copyright: "Copyright © 2025 Sentinel"

directories:
  output: "../dist-electron"
  buildResources: "build"

files:
  - "**/*"

asar: false

publish: null

extraResources:
  - from: "electron/icons"
    to: "icons"
    filter: ["**/*"]

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: "electron/icons/icon.ico"

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sentinel
  uninstallDisplayName: Sentinel HR Simulator
  installerIcon: "electron/icons/icon.ico"
  uninstallerIcon: "electron/icons/icon.ico"
  installerHeaderIcon: "electron/icons/icon.ico"

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: "electron/icons/icon.png"
  category: "Utility"
  maintainer: "Sentinel Team <sentinel@example.com>"
  desktop:
    Name: "Sentinel HR Simulator"
    Comment: "HR training and simulation platform"
    Categories: "Office;Education;"
  executableName: "sentinel"

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libxtst
    - xdg-utils
    - at-spi2-core
    - libuuid
    - libsecret