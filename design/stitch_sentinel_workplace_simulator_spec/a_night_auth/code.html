<!DOCTYPE html><html class="dark" lang="en"><head>

<meta content="width=device-width, initial-scale=1.0" name="viewport">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                      "inverse-surface": "#f0dcf5",
                      "on-error": "#690005",
                      "secondary-container": "#8f1b01",
                      "on-primary-fixed-variant": "#840078",
                      "inverse-primary": "#a71b98",

                      "on-primary-container": "#fffaff",

                      "tertiary": "#51ddb3",
                      "tertiary-fixed-dim": "#51ddb3",
                      "on-surface": "#f0dcf5",
                      "on-secondary-fixed": "#3d0600",
                      "surface-dim": "#1a0f20",
                      "on-secondary": "#630f00",
                      "surface-bright": "#423447",

              },
              "borderRadius": {

                      "lg": "0.5rem",
                      "xl": "0.75rem",

              "spacing": {
                      "margin-page": "2rem",
                      "sidebar-width": "260px",
                      "gutter": "1rem",
                      "stack-compact": "0.5rem",
                      "stack-default": "1.5rem"
              },
              "fontFamily": {
                      "body-sm": [

<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col font-body-sm selection:bg-primary-container selection:text-on-primary-container">
<!-- Minimal Window Header -->
<header class="flex items-center justify-between px-6 h-12 w-full border-b border-[rgba(194,56,176,0.18)] bg-surface-container-lowest shrink-0">
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-outline-variant"></div>
<div class="w-3 h-3 rounded-full bg-outline-variant"></div>
<div class="w-3 h-3 rounded-full bg-outline-variant"></div>
</div>
<div class="font-body-sm text-body-sm text-on-surface-variant text-center absolute left-1/2 -translate-x-1/2">
            Workplace conversation simulator
        </div>
<div class="w-16"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Auth Canvas -->
<main class="flex-1 flex items-center justify-center relative">
<!-- Abstract Tech Background Element -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 50% 50%, rgba(194, 56, 176, 0.05) 0%, transparent 70%);"></div>
<div class="z-10 w-full max-w-md bg-surface border border-[rgba(194,56,176,0.18)] p-8 flex flex-col gap-8 shadow-none rounded-none">
<div class="text-center space-y-2">
<h1 class="font-display-lg text-display-lg text-on-surface tracking-tight">Sentinel</h1>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-4">
<div class="flex flex-col">
<label class="font-body-sm text-body-sm text-on-surface-variant mb-1 sr-only" for="email">Email address</label>
<input class="bg-surface text-on-surface border-0 border-b border-[rgba(194,56,176,0.18)] focus:ring-0 focus:border-primary-container px-0 py-3 font-body-md text-body-md placeholder:text-outline-variant transition-colors rounded-none w-full outline-none" id="email" placeholder="Email address" required="" type="email">
</div>
<div class="flex flex-col">
<label class="font-body-sm text-body-sm text-on-surface-variant mb-1 sr-only" for="password">Password</label>
<input class="bg-surface text-on-surface border-0 border-b border-[rgba(194,56,176,0.18)] focus:ring-0 focus:border-primary-container px-0 py-3 font-body-md text-body-md placeholder:text-outline-variant transition-colors rounded-none w-full outline-none" id="password" placeholder="Password" required="" type="password">
</div>
</div>
<button class="w-full bg-primary-container hover:bg-inverse-primary text-on-primary-container py-3 px-6 font-body-md text-body-md transition-colors rounded-none mt-2 focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background" type="submit">
                    Start session
                </button>
<div class="flex justify-between items-center mt-2">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Reset credentials</a>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Request access</a>
</div>
</form>
</div>
</main>
</body></html>
