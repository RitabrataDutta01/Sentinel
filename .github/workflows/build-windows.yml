name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write       # For creating releases and uploading assets

env:
  NODE_VERSION: '22'
  FRONTEND_DIR: './frontend'

jobs:
  # Job 1: Build Frontend (Linux - faster for Vite build)
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    outputs:
      frontend-dist: ${{ steps.upload-artifact.outputs.artifact-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Upload frontend dist artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist/
          retention-days: 1

  # Job 2: Build Electron Windows Installer (Windows runner required for NSIS)
  build-electron:
    name: Build Windows Installer
    needs: build-frontend
    runs-on: windows-latest
    outputs:
      installer-path: ${{ steps.upload-installer.outputs.artifact-url }}
      installer-name: ${{ steps.get-filename.outputs.filename }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist/

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build Electron Windows installer
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run electron:build
        env:
          # Disable code signing for CI builds
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # GH_TOKEN for electron-updater (if configured later)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find installer file
        id: get-filename
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path "${{ env.FRONTEND_DIR }}\dist-electron" -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($installer) {
            echo "filename=$($installer.Name)" >> $env:GITHUB_OUTPUT
            echo "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "No installer found!"
            exit 1
          }

      - name: Upload installer artifact
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-windows-installer
          path: ${{ env.FRONTEND_DIR }}\dist-electron\*.exe
          retention-days: 30

  # Job 3: Create GitHub Release (only on tag push)
  create-release:
    name: Create GitHub Release
    needs: [build-frontend, build-electron]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: sentinel-windows-installer
          path: ./installer/

      - name: Get installer filename
        id: get-filename
        run: |
          FILE=$(ls ./installer/*.exe | head -1)
          echo "filename=$(basename $FILE)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sentinel ${{ github.ref_name }}
          body: |
            ## Sentinel HR Simulator ${{ github.ref_name }}
            
            ### Installation
            1. Download `Sentinel Setup ${{ github.ref_name }}.exe`
            2. Run the installer
            3. Launch Sentinel from Start Menu or Desktop shortcut
            
            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.
            
            ### System Requirements
            - Windows 10/11 (64-bit)
            - 4GB RAM minimum
            - Internet connection required for AI features
          files: |
            ./installer/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Upload artifacts for main branch (testing)
  upload-main-artifacts:
    name: Upload Main Branch Artifacts
    needs: [build-frontend, build-electron]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: sentinel-windows-installer
          path: ./installer/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-windows-installer-main
          path: ./installer/*.exe
          retention-days: 7