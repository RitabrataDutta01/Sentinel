name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  FRONTEND_DIR: './frontend'

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build the Vite frontend
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  # Job 2: Build Windows installer (NSIS .exe)
  # ──────────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    needs: build-frontend
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist/

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --legacy-peer-deps

      - name: Build Electron Windows installer
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-windows-installer
          path: ${{ env.FRONTEND_DIR }}/dist-electron/*.exe
          retention-days: 30

  # ──────────────────────────────────────────────
  # Job 3: Create GitHub Release (on tag push)
  # ──────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: sentinel-windows-installer
          path: ./installer/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Sentinel ${{ github.ref_name }}
          body: |
            ## Sentinel HR Simulator ${{ github.ref_name }}

            ### Installation
            1. Download `Sentinel Setup *.exe`
            2. Run the installer
            3. Launch Sentinel from Start Menu or Desktop shortcut

            ### System Requirements
            - Windows 10/11 (64-bit)
            - 4 GB RAM minimum
            - Internet connection required for AI features
          files: |
            ./installer/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
